# ============================================================
#  הגדרות מערכת איתור לידים – אנשים שמחפשים צלם
#  אפשר לערוך את הקובץ הזה בלי לגעת בקוד.
# ============================================================

timezone: Asia/Jerusalem

# ------------------------------------------------------------
# 1. מילות מפתח לחיפוש (ביטויים מדויקים שנשלחים למנועי החיפוש)
# ------------------------------------------------------------
search_phrases:
  - "מחפש צלם"
  - "מחפשת צלם"
  - "מחפשים צלם"
  - "מחפשת צלמת"
  - "מחפש צלמת"
  - "מחפשים צלמת"
  - "חיפוש צלם"
  - "אני מחפש צלם"
  - "אני מחפשת צלם"
  - "צריכה צלם"
  - "צריך צלם"
  - "צריכים צלם"
  - "דרוש צלם לאירוע"
  - "דרושה צלמת"
  - "ממליצים על צלם"
  - "ממליצות על צלמת"
  - "המלצה על צלם"
  - "המלצה לצלם"
  - "מישהו מכיר צלם"
  - "מכירים צלם"
  - "צלם מומלץ"
  - "צלמת מומלצת"
  - "looking for a photographer"
  - "need a photographer"
  - "recommend a photographer"

# כמה ביטויים לאחד בשאילתה אחת (OR) – חוסך שאילתות/כסף
phrases_per_query: 5

# ------------------------------------------------------------
# 2. אתרים לחיפוש דרך Google (site:) – פייסבוק ואינסטגרם בעדיפות
# ------------------------------------------------------------
search_sites:
  - facebook.com
  - instagram.com
  - tiktok.com
  - threads.net
  - x.com
  - reddit.com

# חלון זמן: d = יממה אחרונה, w = שבוע אחרון
search_time_window: d

# ------------------------------------------------------------
# 3. מקורות – להפעיל/לכבות (true/false)
#    כל מקור פעיל רק אם הוגדר לו מפתח API (ראו README)
# ------------------------------------------------------------
sources:
  serper:          # Google דרך serper.dev – מומלץ, הכי פשוט
    enabled: true
  google_cse:      # Google Programmable Search – חלופה
    enabled: true
  apify_facebook_groups:   # סריקה ישירה של קבוצות פייסבוק ציבוריות
    enabled: true
    results_per_group: 40
    groups:
      # הוסיפו כאן קישורים לקבוצות פייסבוק ציבוריות רלוונטיות, למשל:
      # - https://www.facebook.com/groups/XXXXXXXX
      []
  apify_instagram_hashtags:  # פוסטים חדשים בהאשטגים באינסטגרם
    enabled: true
    results_per_hashtag: 30
    hashtags:
      - מחפשתצלם
      - מחפשצלם
      - צלםחתונות
      - צלמתהריון
      - lookingforaphotographer
  reddit:          # חיפוש ברדיט (ללא מפתח)
    enabled: true
    queries:
      - "looking for photographer Israel"
      - "need photographer Tel Aviv"
      - "photographer recommendation Israel"
  rss:             # Google Alerts / rss.app / כל פיד RSS
    enabled: true
    feeds:
      # הדביקו כאן קישורי RSS (למשל מ-Google Alerts או rss.app)
      []

# ------------------------------------------------------------
# 4. סינון – מה נחשב ליד ומה לא
# ------------------------------------------------------------
classifier:
  # מילים שמראות כוונה לשכור צלם
  intent_words:
    - מחפש
    - מחפשת
    - מחפשים
    - מחפשות
    - חיפוש
    - צריך
    - צריכה
    - צריכים
    - דרוש
    - דרושה
    - ממליצים
    - ממליצות
    - תמליצו
    - המלצה
    - המלצות
    - מומלץ
    - מומלצת
    - מכיר
    - מכירה
    - מכירים
    - looking
    - need
    - needed
    - recommend
    - recommendation
    - recommendations
    - seeking

  # מילים שמתארות צלם/צילום
  photographer_words:
    - צלם
    - צלמת
    - צלמים
    - צלמות
    - צילום
    - צילומים
    - photographer
    - photographers
    - photoshoot
    - videographer

  # מרחק מקסימלי (במילים) בין מילת כוונה למילת צלם
  max_distance: 5

  # ביטויים שפוסלים – חיפוש עבודה / משרות / גיוס
  job_exclusions:
    - מחפש עבודה
    - מחפשת עבודה
    - מחפש משרה
    - מחפשת משרה
    - צלם מחפש
    - צלמת מחפשת
    - פנוי לעבודה
    - פנויה לעבודה
    - פנוי לעבודות
    - פנויה לעבודות
    - דרושים
    - דרושות
    - משרה
    - משרות
    - משמרות
    - קורות חיים
    - קו"ח
    - שכר
    - גיוס
    - מגייסת
    - מגייסים
    - ללא ניסיון
    - הכשרה
    - קורס צילום
    - סדנת צילום
    - hiring
    - job
    - jobs
    - salary
    - resume
    - full-time
    - part-time
    - "[for hire]"
    - for hire
    - internship
    - apply now

  # ביטויים שפוסלים – צלמים שמפרסמים את עצמם
  promo_exclusions:
    - נשארו תאריכים
    - תאריכים פנויים
    - פנויים לתאריכים
    - חבילות צילום
    - חבילת צילום
    - מבצע
    - הנחה
    - הזמינו עכשיו
    - לפרטים בפרטי
    - לתיאום צילומים
    - book now
    - booking now
    - discount

  # סוגי אירועים – מעלים ציון ומוצגים בדוח
  event_types:
    חתונה: [חתונה, חתונת, חופה, wedding]
    בר/בת מצווה: [בר מצווה, בת מצווה, בר-מצווה, בת-מצווה, bar mitzvah, bat mitzvah]
    ברית/בריתה: [ברית, בריתה, זבד הבת]
    הריון/ניו בורן: [הריון, ניו בורן, ניובורן, newborn, maternity]
    משפחה: [משפחה, משפחתי, משפחתית, family]
    אירוסין/הצעה: [אירוסין, הצעת נישואין, engagement, proposal]
    אירוע: [אירוע, יום הולדת, מסיבה, event, party]
    תדמית/עסקי: [תדמית, תדמיתי, לינקדאין, עסקי, headshot, branding]
    מוצר: [מוצר, מוצרים, קטלוג, product]
    נדל"ן: [נדלן, נדל"ן, דירה, real estate]

  min_score: 1

# ------------------------------------------------------------
# 5. שמירה ודיווח
# ------------------------------------------------------------
output_dir: output        # קבצי CSV יומיים (לא נשמרים ב-git)
seen_file: data/seen.json # זיכרון של לידים שכבר נשלחו (רק hash, בלי מידע אישי)
seen_retention_days: 90
max_leads_in_message: 30
